<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الكلمات - المهندسة حنين</title>
    <style>
        body { background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .box { background: #fff; width: 100%; max-width: 390px; border-radius: 25px; padding: 25px 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center; }
        .avatar { width: 120px; height: 120px; margin: 0 auto 10px; background: #e0f2fe; border-radius: 50%; border: 4px solid #3b82f6; display: flex; justify-content: center; align-items: center; }
        .card { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 18px; padding: 15px; margin: 12px 0; }
        .sig { display: inline-block; background: #1a2a6c; color: #fff; padding: 6px 16px; border-radius: 12px; font-weight: bold; margin-top: 10px; }
        .btn { width: 90%; background: linear-gradient(to right, #ff595e, #ff9f1c); color: #fff; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 14px; cursor: pointer; margin-top: 10px; }
        .clue { background: #2b5876; color: #fff; padding: 16px; border-radius: 16px; margin: 15px 0; font-size: 18px; font-weight: bold; }
        .slots, .grid { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 15px 0; }
        .slot { width: 40px; height: 44px; border: 2px solid #94a3b8; border-radius: 10px; font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; background: #f1f5f9; }
        .l-btn { width: 46px; height: 48px; background: #ff9f1c; color: #fff; border: none; border-bottom: 4px solid #d97706; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; }
        .l-btn:disabled { background: #e2e8f0; border-color: #cbd5e1; color: transparent; }
        .top { display: flex; justify-content: space-between; background: #f1f5f9; padding: 10px; border-radius: 12px; font-weight: bold; color: #1a2a6c; }
    </style>
</head>
<body>
<div class="box">
    <div id="wScreen">
        <div class="avatar">
            <svg viewBox="0 0 200 200" width="110" height="110"><circle cx="100" cy="95" r="42" fill="#3b2f2f"/><circle cx="100" cy="100" r="32" fill="#fde68a"/><path d="M64 88 C64 55, 136 55, 136 88 Z" fill="#f59e0b"/><rect x="58" y="84" width="84" height="7" rx="3" fill="#d97706"/><circle cx="88" cy="98" r="7" stroke="#1e3a8a" stroke-width="2" fill="none"/><circle cx="112" cy="98" r="7" stroke="#1e3a8a" stroke-width="2" fill="none"/><path d="M92 112 Q100 120 108 112" stroke="#b91c1c" stroke-width="3" fill="none"/><path d="M55 175 C55 140, 145 140, 145 175 Z" fill="#1d4ed8"/></svg>
        </div>
        <h2 style="color:#1a2a6c; margin:5px 0;">أهلاً وسهلاً بكم</h2>
        <div class="card">
            <p style="margin:0; font-weight:bold; color:#1e293b; line-height:1.6;">هذه اللعبة الأولى والموقع الأول ضمن نطاق التجربة لي، أتمنى أن تنال إعجابكم 🌟</p>
            <div class="sig">معكم المهندسة حنين 📡👩‍💻</div>
        </div>
        <button class="btn" onclick="go()">ابدأ اللعب الآن 🚀</button>
    </div>

    <div id="gScreen" style="display:none;">
        <div class="top">
            <span>المرحلة: <b id="lvl">1</b>/6</span>
            <span>النقاط: <b id="pts">50</b> ⭐</span>
            <button onclick="toggleSnd()" id="sndBtn" style="border:none; background:none; font-size:18px; cursor:pointer;">🔊</button>
        </div>
        <div class="clue" id="clueTxt"></div>
        <div class="slots" id="slotsDiv"></div>
        <div class="grid" id="gridDiv"></div>
        <button onclick="clr()" style="background:#ef4444; color:#fff; border:none; padding:10px 18px; border-radius:10px; font-weight:bold; cursor:pointer;">مسح ⌫</button>
        <button onclick="hint()" style="background:#8b5cf6; color:#fff; border:none; padding:10px 18px; border-radius:10px; font-weight:bold; cursor:pointer;">تلميح 💡</button>
        <p id="msg" style="font-weight:bold; min-height:22px;"></p>
        <button id="nxtBtn" onclick="nxt()" style="display:none; width:100%; background:#10b981; color:#fff; border:none; padding:12px; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer;">المرحلة التالية ⬅️</button>
    </div>
</div>

<script>
const data = [
    {q: "أقدم عاصمة مأهولة في التاريخ وعاصمة سوريا", a: "دمشق", e: "رلب"},
    {q: "شيء يكتب ولا يقرأ، ما هو؟", a: "القلم", e: "سنت"},
    {q: "مدينة سورية تشتهر بالجبل والعنب والتفاح", a: "السويداء", e: "مرك"},
    {q: "أكبر كوكب في المجموعة الشمسية", a: "المشتري", e: "عقد"},
    {q: "له أسنان كثيرة ولكنه لا يعض", a: "المشط", e: "فحن"},
    {q: "عقل الحاسوب الذي يعالج البيانات", a: "المعالج", e: "صضط"}
];
let cur = 0, pts = 50, guess = [], used = [], ctx = null, playing = false, timer = null;

function playTone(f, d) {
    if (!playing) return;
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    let o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.03, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + d);
}

function toggleSnd() {
    playing = !playing;
    document.getElementById("sndBtn").innerText = playing ? "🔊" : "🔇";
}

function go() {
    document.getElementById("wScreen").style.display = "none";
    document.getElementById("gScreen").style.display = "block";
    playing = true;
    const notes = [261.6, 329.6, 392.0, 493.8]; let s = 0;
    timer = setInterval(() => { playTone(notes[s++ % 4], 1.0); }, 950);
    load();
}

function load() {
    guess = []; used = [];
    document.getElementById("msg").innerText = "";
    document.getElementById("nxtBtn").style.display = "none";
    document.getElementById("lvl").innerText = cur + 1;
    document.getElementById("clueTxt").innerText = data[cur].q;
    let sDiv = document.getElementById("slotsDiv"); sDiv.innerHTML = "";
    for (let i = 0; i < data[cur].a.length; i++) sDiv.innerHTML += `<div class="slot" id="s${i}"></div>`;
    let chars = (data[cur].a + data[cur].e).split("").sort(() => Math.random() - 0.5);
    let gDiv = document.getElementById("gridDiv"); gDiv.innerHTML = "";
    chars.forEach((c, i) => gDiv.innerHTML += `<button class="l-btn" id="b${i}" onclick="pick('${c}',${i})">${c}</button>`);
}

function pick(c, i) {
    playTone(523.2, 0.15);
    if (guess.length < data[cur].a.length) {
        document.getElementById("s" + guess.length).innerText = c;
        document.getElementById("b" + i).disabled = true;
        guess.push(c); used.push(i);
        if (guess.length === data[cur].a.length) {
            if (guess.join("") === data[cur].a) {
                pts += 20; document.getElementById("pts").innerText = pts;
                document.getElementById("msg").style.color = "green";
                document.getElementById("msg").innerText = "🎉 أحسنت! إجابة صحيحة";
                document.getElementById("nxtBtn").style.display = "block";
            } else {
                document.getElementById("msg").style.color = "red";
                document.getElementById("msg").innerText = "❌ خطأ! اضغط مسح وحاول مجدداً";
            }
        }
    }
}

function clr() {
    if (guess.join("") === data[cur].a) return;
    guess = []; document.getElementById("msg").innerText = "";
    for (let i = 0; i < data[cur].a.length; i++) document.getElementById("s" + i).innerText = "";
    used.forEach(i => document.getElementById("b" + i).disabled = false); used = [];
}

function hint() {
    if (pts < 10 || guess.join("") === data[cur].a) return;
    pts -= 10; document.getElementById("pts").innerText = pts; clr();
    let f = data[cur].a[0], btns = document.querySelectorAll(".l-btn");
    for (let i = 0; i < btns.length; i++) if (btns[i].innerText === f && !btns[i].disabled) { pick(f, i); break; }
}

function nxt() {
    cur++;
    if (cur < data.length) load();
    else document.getElementById("gScreen").innerHTML = `<h2>🏆 مبروك! أنهيت لعبة المهندسة حنين بنجاح!</h2><p>نقاطك: ${pts} ⭐</p><button class="btn" onclick="location.reload()">إعادة اللعب 🔄</button>`;
}
</script>
</body>
</html>
